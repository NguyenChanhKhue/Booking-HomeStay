services:
  db:
    image: mysql:8.4
    container_name: bookinghomestay-db
    restart: unless-stopped
    command: --max_connect_errors=100000
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bookinghomestay_db}
      MYSQL_USER: ${MYSQL_USER:-booking_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-booking_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: ${TZ:-Asia/Bangkok}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init_db:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p$${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookinghomestay-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-bookinghomestay_db}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=${TZ:-Asia/Bangkok}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-booking_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-booking_password}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-BookingHomeStayJwtSecretKeyForDevOnly1234567890}
      APP_JWT_EXPIRATION: ${APP_JWT_EXPIRATION:-86400000}
      APP_OTP_EXPIRATION_MINUTES: ${APP_OTP_EXPIRATION_MINUTES:-10}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE:-true}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-}
      TZ: ${TZ:-Asia/Bangkok}
    ports:
      - "${BACKEND_PORT:-4040}:4040"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bookinghomestay-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  mysql_data:
